[project]
name = "orbit-air-baggage-desk"
version = "0.1.0"
description = "Command line claims desk for Orbit Air lost, delayed, and damaged baggage"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["claims", "db", "main"]
